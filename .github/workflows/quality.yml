name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Lint, types and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Check types
        run: npx tsc --noEmit

      - name: Build production application
        run: npm run build

